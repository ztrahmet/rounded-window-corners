name: unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: parser and shadow compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # lib/cssParse.js and lib/shadowProfile.js import nothing from GNOME, so
      # they run under plain node without a shell.
      - run: ./tests/unit/run.sh
