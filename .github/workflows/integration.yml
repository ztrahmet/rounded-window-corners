name: integration

# Docs and images cannot change behavior, so skip pushes that change only those.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', 'data/**', 'README.md', 'LICENSE']
  pull_request:
    paths-ignore: ['docs/**', 'data/**', 'README.md', 'LICENSE']
  workflow_dispatch:
  # Distributions update libadwaita within a release, so check it for drift weekly.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: GNOME ${{ matrix.gnome }}
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide the others.
      fail-fast: false
      matrix:
        include:
          - {fedora: 'rawhide', gnome: '51'}
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: |
          podman build -f tests/integration/Containerfile \
            --build-arg FEDORA=${{ matrix.fedora }} \
            -t rwc-test tests/integration/

      # Without --privileged the shell cannot take screenshots and the pixel checks are skipped.
      - name: Functional tests
        run: |
          podman run --rm --privileged --user 0 \
            -v "$PWD:/src:ro" -v "$PWD/tests:/tests:ro" \
            rwc-test /tests/integration/entrypoint.sh

      - name: libadwaita drift canary
        run: |
          podman run --rm -v "$PWD:/src:ro" \
            rwc-test gjs -m /src/tests/integration/drift-canary.js

  packaged:
    name: the uploaded package runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: |
          podman build -f tests/integration/Containerfile --build-arg FEDORA=rawhide \
            -t rwc-test tests/integration/

      # Test the package that gets uploaded, not only the source tree it was built from.
      - name: Build the package and run the suite against it
        run: |
          podman run --rm --user 0 -v "$PWD:/src" rwc-test \
            bash -c 'cd /src && ./scripts/package.sh'
          mkdir -p /tmp/pkg
          unzip -q dist/*.shell-extension.zip -d /tmp/pkg
          podman run --rm --privileged --user 0 -e EXT_SRC=/pkg \
            -v /tmp/pkg:/pkg:ro -v "$PWD/tests:/tests:ro" \
            rwc-test /tests/integration/entrypoint.sh

      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/*.shell-extension.zip
